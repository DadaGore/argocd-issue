apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-projects
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DadaGore/argocd-issue.git
    targetRevision: main
    path: projects
  destination:
    server: https://kubernetes.default.svc
    namespace: ""
  ignoreDifferences:
    - group: management.loft.sh
      kind: Project
      jsonPointers:
        - /metadata/resourceVersion
        - /metadata/generation
        - /metadata/managedFields
        - /status
        - /spec/owner
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - RespectIgnoreDifferences=true
