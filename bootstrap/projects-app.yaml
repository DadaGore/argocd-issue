apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-projects
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DadaGore/argocd-issue.git
    targetRevision: main
    path: projects
  destination:
    server: https://kubernetes.default.svc
    namespace: vcluster-platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
